apiVersion: apps/v1
kind: Deployment

metadata:
  name: library-gateway
  labels:
    app: library-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: library-gateway

  template:
    metadata:
      labels:
        app: library-gateway

    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: library-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 80
              name: http

          volumeMounts:
            - name: jwt-public-key
              mountPath: /usr/local/openresty/nginx/keys/public.pem
              subPath: public.pem
              readOnly: true

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

      volumes:
        - name: jwt-public-key
          secret:
            secretName: gateway-public-key