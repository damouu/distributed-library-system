apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-redis

  template:

    metadata:
      labels:
        app: auth-redis

    spec:

      containers:

        - name: redis

          image: redis:7-alpine

          ports:
            - containerPort: 6379