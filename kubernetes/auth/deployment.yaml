apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentification
spec:

  replicas: 2

  selector:
    matchLabels:
      app: library-app-auth


  template:

    metadata:
      labels:
        app: library-app-auth


    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: library-app-auth
      volumes:
        - name: auth-keys
          secret:
            secretName: auth-keys
            items:
              - key: private.pem
                path: private.pem
              - key: public.pem
                path: public.pem

      containers:

        - name: auth

          volumeMounts:
            - name: auth-keys
              mountPath: /var/www/html/keys
              readOnly: true

          image: damou/library-app-auth:3726aae54b3163504e47274da71c2020c79b8536-otel-3

          ports:
            - containerPort: 80


          envFrom:

            - configMapRef:
                name: auth-config


            - secretRef:
                name: auth-secret

          startupProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 5
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3


          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20