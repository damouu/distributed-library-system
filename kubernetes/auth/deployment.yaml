apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentification
spec:

  replicas: 2

  selector:
    matchLabels:
      app: library-app-auth


  template:

    metadata:
      labels:
        app: library-app-auth


    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: library-app-auth
      volumes:
        - name: auth-keys
          secret:
            secretName: auth-keys
            items:
              - key: private.pem
                path: private.pem
              - key: public.pem
                path: public.pem
        - name: kafka-aiven-ca
          configMap:
            name: kafka-aiven-ca

      containers:
        - name: auth
          volumeMounts:
            - name: auth-keys
              mountPath: /var/www/html/keys
              readOnly: true

            - name: kafka-aiven-ca
              mountPath: /app/ca.pem
              subPath: ca.pem
              readOnly: true

          image: damou/library-app-auth:faeaa2e3125aa3d9dfa647bf389c06d784799bdd

          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret

          env:
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-secret
                  key: KAFKA_USERNAME

            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-secret
                  key: KAFKA_PASSWORD


          startupProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 5
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3


          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20