apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: analytics
      containers:
        - name: analytics
          image: damou/library-app-analytics:5e21057acf6e864e4601d1d4ee1f826463e36709
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secret
                  key: POSTGRES_PASSWORD

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "library-app-kafka-library-app.l.aivencloud.com:19687"

            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-secret
                  key: KAFKA_USERNAME

            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-secret
                  key: KAFKA_PASSWORD

            - name: KAFKA_CA_PATH
              value: "file:/app/ca.pem"

            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: SPRING_DATA_REDIS_HOST

            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: SPRING_DATA_REDIS_PORT

            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: OTEL_SERVICE_NAME

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

          volumeMounts:
            - name: jwt-public-key
              mountPath: /etc/keys
              readOnly: true

            - name: kafka-aiven-ca
              mountPath: /app/ca.pem
              subPath: ca.pem
              readOnly: true

          livenessProbe:
            httpGet:
              path: /api/analytics/actuator/health
              port: 8083
            initialDelaySeconds: 90

      volumes:
        - name: jwt-public-key
          secret:
            secretName: jwt-public-key

        - name: kafka-aiven-ca
          configMap:
            name: kafka-aiven-ca
