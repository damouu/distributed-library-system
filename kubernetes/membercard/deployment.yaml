apiVersion: apps/v1
kind: Deployment
metadata:
  name: membercard
  namespace: default
  annotations:
    keel.sh/policy: "all"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: membercard
  template:
    metadata:
      labels:
        app: membercard
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: membercard
                topologyKey: kubernetes.io/hostname
      containers:
        - name: membercard
          image: damou/library-app-membercard:0830c9ff598f1fb06d759860646954710b39b845
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: membercard-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: membercard-db-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: membercard-db-secret
                  key: POSTGRES_PASSWORD

            - name: KAFKA_HOST
              value: "kafka-bootstrap"

            - name: KAFKA_PORT
              value: "9092"

            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: membercard-config
                  key: OTEL_SERVICE_NAME

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: membercard-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

          livenessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10