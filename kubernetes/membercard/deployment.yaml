apiVersion: apps/v1
kind: Deployment
metadata:
  name: membercard
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: membercard
  template:
    metadata:
      labels:
        app: membercard
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: membercard
                topologyKey: kubernetes.io/hostname

      containers:
        - name: membercard
          image: damou/library-app-membercard:179e8fba417d642087efeea2824501fe83cbd555

          ports:
            - containerPort: 8083

          volumeMounts:
            - name: kafka-aiven-ca
              mountPath: /app/ca.pem
              subPath: ca.pem
              readOnly: true

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: membercard-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: membercard-db-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: membercard-db-secret
                  key: POSTGRES_PASSWORD

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "library-app-kafka-library-app.l.aivencloud.com:19687"

            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-secret
                  key: KAFKA_USERNAME

            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-secret
                  key: KAFKA_PASSWORD

            - name: KAFKA_CA_PATH
              value: "file:/app/ca.pem"

            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: membercard-config
                  key: OTEL_SERVICE_NAME

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: membercard-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

          livenessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: kafka-aiven-ca
          configMap:
            name: kafka-aiven-ca