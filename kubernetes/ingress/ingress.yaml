apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-ingress

spec:
  ingressClassName: nginx

  rules:

    - host: api.damou.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: library-gateway
                port:
                  number: 80

    - host: jaeger.damou.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
