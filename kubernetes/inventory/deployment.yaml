apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: inventory
                topologyKey: kubernetes.io/hostname
      containers:
        - name: inventory
          image: damou/library-app-inventory:63839ca55b3e8a149a10e492e01fc8344a4e724e
          volumeMounts:
            - name: kafka-aiven-ca
              mountPath: /app/ca.pem
              subPath: ca.pem
              readOnly: true
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: inventory-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: inventory-db-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-secret
                  key: POSTGRES_PASSWORD

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "library-app-kafka-library-app.l.aivencloud.com:19687"

            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-secret
                  key: KAFKA_USERNAME

            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-secret
                  key: KAFKA_PASSWORD

            - name: KAFKA_CA_PATH
              value: "file:/app/ca.pem"

            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: inventory-config
                  key: OTEL_SERVICE_NAME

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: inventory-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

          livenessProbe:
            httpGet:
              path: /api/inventory/actuator/health
              port: 8083
            initialDelaySeconds: 90

      volumes:
        - name: kafka-aiven-ca
          configMap:
            name: kafka-aiven-ca