events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;


    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';


    sendfile        on;
    keepalive_timeout  65;


     upstream auth_service {
           server library-app-auth:80;
        }


        upstream records_service {
            server records:8083;
        }

        upstream comments_service {
            server comments:3000;
        }

        upstream analytics_service {
            server analytics:8083;
        }


        upstream inventory_service {
        server inventory:8083;
     }


    upstream borrow_service {
       server borrow:8083;
     }

    upstream catalogue_service {
        server catalogue:8083;
    }

    server {
        listen 80;
        server_name localhost;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Handle Preflight OPTIONS requests for all routes
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # --- ROUTING RULES ---

        # 1. Auth Service
        # Requests to /api/auth/... -> Auth Container


        location /api/auth/ {
            proxy_hide_header 'Access-Control-Allow-Origin';
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' text/plain;
                return 204;
            }

            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


          location /api/comment/ {

              proxy_pass http://comments_service;

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }


         location /api/borrow/ {

            access_by_lua_file /usr/local/openresty/nginx/lua/authorize.lua;

            proxy_pass http://borrow_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-User-UUID $http_x_user_uuid;

        }


        location /api/records {

            access_by_lua_file /usr/local/openresty/nginx/lua/authorize.lua;

            proxy_pass http://records_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-User-UUID $http_x_user_uuid;

        }



        # 4. Inventory Service
        location /api/inventory/ {
            proxy_pass http://inventory_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


       # 4. Catalogue Service
       location /api/catalogue/ {
           # This automatically takes everything AFTER /api/catalogue/
           # and passes it to http://catalogue:8083/
           proxy_pass http://catalogue_service;

           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header X-Original-URI $request_uri;
       }



       # 4. Analytics Service
       location /api/analytics/ {
           # This automatically takes everything AFTER /api/catalogue/
           # and passes it to http://analytics:8083/
           proxy_pass http://analytics_service;

           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;

       }

        # Health Check for the Gateway itself
        location /health {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }
    }
}